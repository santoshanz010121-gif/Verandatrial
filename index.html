<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veranda Garden Management System</title>
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --success: #16a34a;
      --success-hover: #15803d;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 32px 16px;
      max-width: 1400px;
      margin: 0 auto;
      line-height: 1.5;
    }

    header {
      background: var(--card-bg);
      padding: 24px 32px;
      border-radius: var(--radius-lg);
      margin-bottom: 32px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
    }

    @media (min-width: 1024px) {
      .grid-container {
        grid-template-columns: repeat(2, 1fr);
      }
      .full-width {
        grid-column: span 2;
      }
    }

    .module-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .module-card h2 {
      font-size: 1.125rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    input {
      flex: 1;
      min-width: 130px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      background-color: var(--card-bg);
      color: var(--text-main);
      transition: var(--transition);
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-success {
      background-color: var(--success);
      color: white;
      width: 100%;
    }

    .btn-success:hover {
      background-color: var(--success-hover);
      transform: translateY(-1px);
    }

    .queue-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .queue-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: var(--bg-color);
      border-radius: var(--radius-md);
      border-left: 4px solid var(--primary);
      transition: var(--transition);
    }

    .queue-item:hover {
      transform: translateX(2px);
      background: var(--primary-light);
    }

    .badge {
      background: var(--primary);
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .summary-chips {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .chip {
      padding: 14px 8px;
      background: var(--bg-color);
      border-radius: var(--radius-md);
      text-align: center;
      border: 1px solid var(--border);
    }

    .chip span {
      display: block;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .chip label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .tables-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
    }

    .table-card {
      padding: 16px 12px;
      border-radius: var(--radius-md);
      text-align: center;
      color: white;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .table-card:hover {
      transform: scale(1.03);
      box-shadow: var(--shadow-md);
    }

    .table-card.available {
      background: linear-gradient(135deg, #22c55e, #16a34a);
    }

    .table-card.occupied {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }

    .table-card small {
      display: block;
      font-weight: 500;
      font-size: 0.75rem;
      opacity: 0.9;
      margin-top: 4px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      padding: 20px;
      border-radius: var(--radius-md);
      background: var(--bg-color);
      border: 1px solid var(--border);
    }

    .stat-card h3 {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .stat-card .value {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      background: var(--card-bg);
    }

    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: var(--bg-color);
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: var(--primary-light);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 24px 0;
      font-style: italic;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Veranda Resto Garden Management System</h1>
    </div>
  </header>

  <div class="grid-container">

    <section class="module-card">
      <h2>Waitlist Management</h2>
      
      <form id="enqueueForm" class="form-group" onsubmit="handleEnqueue(event)">
        <input type="text" id="guestName" placeholder="Guest Name" required>
        <input type="number" id="partySize" placeholder="Party Size" min="1" required>
        <input type="text" id="contactInfo" placeholder="Contact Info" required>
        <button type="submit" class="btn-primary">Enqueue Group</button>
      </form>

      <div style="margin-bottom: 12px;">
        <button onclick="handleDequeue()" class="btn-success">
          Seat Next Party (Dequeue Front)
        </button>
      </div>

      <ul id="waitlistQueue" class="queue-list">
      </ul>
    </section>

    <section class="module-card">
      <h2>Table Availability</h2>
      
      <div class="summary-chips">
        <div class="chip">
          <span id="chipOpenTables">0</span>
          <label>Open Tables</label>
        </div>
        <div class="chip">
          <span id="chipOccupiedTables">0</span>
          <label>Occupied Tables</label>
        </div>
        <div class="chip">
          <span id="chipAvailableSeats">0</span>
          <label>Available Seats</label>
        </div>
      </div>

      <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px;">
        * Click any table card to toggle status manually (Available / Occupied).
      </p>

      <div id="tablesGrid" class="tables-grid">
      </div>
    </section>

    <section class="module-card full-width">
      <h2>Financial Analytics</h2>
      
      <div class="stats-row">
        <div class="stat-card">
          <h3>Total Revenue</h3>
          <div class="value" id="statRevenue">₱0.00</div>
        </div>
        <div class="stat-card">
          <h3>Total Guests Served</h3>
          <div class="value" id="statGuests">0</div>
        </div>
        <div class="stat-card">
          <h3>Average Spend / Head</h3>
          <div class="value" id="statAverage">₱0.00</div>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Timestamp</th>
              <th>Party Size</th>
              <th>Total Amount</th>
            </tr>
          </thead>
          <tbody id="salesTableBody">
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>

    let waitlist = [];

    let tables = [
      { id: 1, capacity: 4, status: "available" },
      { id: 2, capacity: 2, status: "occupied" },
      { id: 3, capacity: 6, status: "available" },
      { id: 4, capacity: 2, status: "available" },
      { id: 5, capacity: 4, status: "occupied" }
    ];

    // Added sample completed transactions so analytics render on load
    let sales = [
      { id: "TXN-101", timestamp: "12:30 PM", guests: 2, amount: 1000 },
      { id: "TXN-102", timestamp: "01:15 PM", guests: 4, amount: 2000 }
    ];
    
    function renderWaitlist() {
      const container = document.getElementById("waitlistQueue");
      container.innerHTML = "";

      if (waitlist.length === 0) {
        container.innerHTML = `<li class="empty-state">No parties currently in queue.</li>`;
        return;
      }

      waitlist.forEach((party, index) => {
        const item = document.createElement("li");
        item.className = "queue-item";
        item.innerHTML = `
          <div>
            <strong>${party.name}</strong> (${party.partySize} guests)
            <br><small style="color: var(--text-muted);">${party.contact}</small>
          </div>
          <span class="badge">Position ${index + 1}</span>
        `;
        container.appendChild(item);
      });
    }

    function handleEnqueue(e) {
      e.preventDefault();
      const nameInput = document.getElementById("guestName");
      const sizeInput = document.getElementById("partySize");
      const contactInput = document.getElementById("contactInfo");

      const newParty = {
        name: nameInput.value.trim(),
        partySize: parseInt(sizeInput.value),
        contact: contactInput.value.trim()
      };

      waitlist.push(newParty);

      nameInput.value = "";
      sizeInput.value = "";
      contactInput.value = "";

      renderWaitlist();
    }

    function handleDequeue() {
      if (waitlist.length === 0) {
        alert("The waitlist is currently empty!");
        return;
      }

      const seatedParty = waitlist.shift();

      const availableTable = tables.find(t => t.status === "available" && t.capacity >= seatedParty.partySize);

      if (availableTable) {
        availableTable.status = "occupied";
        alert(`Seated ${seatedParty.name} (Party of ${seatedParty.partySize}) at Table ${availableTable.id}.`);
      } else {
        alert(`Dequeued ${seatedParty.name}. No available table with sufficient seats was found automatically.`);
      }

      renderWaitlist();
      renderTables();
    }
    
    function renderTables() {
      const grid = document.getElementById("tablesGrid");
      grid.innerHTML = "";

      let availableCount = 0;
      let occupiedCount = 0;
      let availableSeats = 0;

      for (let i = 0; i < tables.length; i++) {
        const currentTable = tables[i];

        if (currentTable.status === "available") {
          availableCount++;
          availableSeats += currentTable.capacity;
        } else {
          occupiedCount++;
        }

        const card = document.createElement("div");
        card.className = `table-card ${currentTable.status}`;
        card.onclick = () => toggleTableStatus(currentTable.id);
        card.innerHTML = `
          Table ${currentTable.id}
          <small>${currentTable.capacity} Seats</small>
          <small>[${currentTable.status.toUpperCase()}]</small>
        `;
        grid.appendChild(card);
      }

      document.getElementById("chipOpenTables").innerText = availableCount;
      document.getElementById("chipOccupiedTables").innerText = occupiedCount;
      document.getElementById("chipAvailableSeats").innerText = availableSeats;
    }

    function toggleTableStatus(tableId) {
      const table = tables.find(t => t.id === tableId);
      if (table) {
        table.status = table.status === "available" ? "occupied" : "available";
        renderTables();
      }
    }

    function renderAnalytics() {
      let totalRevenue = 0;
      let totalGuests = 0;

      const tbody = document.getElementById("salesTableBody");
      tbody.innerHTML = "";

      for (let i = 0; i < sales.length; i++) {
        const record = sales[i];
        totalRevenue += record.amount;
        totalGuests += record.guests;

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${record.id}</td>
          <td>${record.timestamp}</td>
          <td>${record.guests}</td>
          <td>₱${record.amount.toLocaleString("en-PH", { minimumFractionDigits: 2 })}</td>
        `;
        tbody.appendChild(row);
      }

      const averageSpend = totalGuests > 0 ? (totalRevenue / totalGuests) : 0;

      document.getElementById("statRevenue").innerText = `₱${totalRevenue.toLocaleString("en-PH", { minimumFractionDigits: 2 })}`;
      document.getElementById("statGuests").innerText = totalGuests;
      document.getElementById("statAverage").innerText = `₱${averageSpend.toLocaleString("en-PH", { minimumFractionDigits: 2 })}`;
    }

    window.onload = function() {
      renderWaitlist();
      renderTables();
      renderAnalytics();
    };
  </script>
</body>
</html>
